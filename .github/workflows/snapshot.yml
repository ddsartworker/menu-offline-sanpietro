name: Snapshot menu

# Il menu cambia piu' volte al giorno (piatti del giorno, vini esauriti), quindi
# si controlla ogni 15 minuti. Se il contenuto non e' cambiato non si pubblica
# nulla e il tablet non scarica nulla: girare spesso non costa banda al locale.
#
# I minuti sono sfalsati e non a inizio quarto d'ora: le esecuzioni programmate
# di GitHub sono piu' spesso in ritardo negli istanti di punta.
#
# La logica sta negli script in tools/: qui restano solo le chiamate, cosi' una
# correzione non richiede di modificare un file di workflow.
on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La versione sta in .nvmrc e non qui: e' un file normale, quindi il giro
      # settimanale di tools/strumenti.sh puo' portarla avanti da solo dopo
      # averla provata, mentre un file di workflow non puo' modificarlo.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Dipendenze
        run: pip install --quiet fonttools brotli

      # Un giro storto con un menu fresco alle spalle non fa fallire niente:
      # la differenza fra un buco passeggero e un guasto la fa tools/giro.sh.
      - name: Cattura e pubblica
        env:
          CHROME_PATH: /usr/bin/google-chrome
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/giro.sh

      - name: Riepilogo
        if: always()
        run: |
          {
            echo "### Snapshot menu"
            echo ""
            if [ -f dist/version.json ]; then
              echo "- Dimensione: $(( $(jq -r .size dist/version.json) / 1024 )) KB"
              echo "- SHA256: \`$(jq -r .sha256 dist/version.json | cut -c1-16)\`"
              echo "- Prezzi: $(grep -o '€' dist/menu.html | wc -l | tr -d ' ')"
              echo "- Allergeni: $(grep -o 'allergen-food' dist/menu.html | wc -l | tr -d ' ')"
            else
              echo "- Cattura fallita"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
