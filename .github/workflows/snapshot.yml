name: Snapshot menu

# Il menu cambia quasi ogni giorno (piatti del giorno), quindi si controlla ogni
# ora. Se il contenuto non e' cambiato non si pubblica nulla e il tablet non
# scarica nulla.
#
# La logica sta negli script in tools/: qui restano solo le chiamate, cosi' una
# correzione non richiede di modificare un file di workflow.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dipendenze
        run: pip install --quiet fonttools brotli

      - name: Cattura e ottimizza
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: bash tools/capture.sh

      - name: Pubblica se cambiato
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/publish.sh

      - name: Riepilogo
        if: always()
        run: |
          {
            echo "### Snapshot menu"
            echo ""
            if [ -f dist/version.json ]; then
              echo "- Dimensione: $(( $(jq -r .size dist/version.json) / 1024 )) KB"
              echo "- SHA256: \`$(jq -r .sha256 dist/version.json | cut -c1-16)\`"
              echo "- Prezzi: $(grep -o '€' dist/menu.html | wc -l | tr -d ' ')"
              echo "- Allergeni: $(grep -o 'allergen-food' dist/menu.html | wc -l | tr -d ' ')"
            else
              echo "- Cattura fallita"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
