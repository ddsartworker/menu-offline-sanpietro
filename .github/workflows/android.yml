name: Build APK

# L'APK si compila qui, non sul portatile: un MacBook con 8 GB di RAM e
# Android Studio non e' una combinazione felice.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # La chiave e' sempre la stessa, se no ogni APK nuovo non si installa
      # sopra il precedente e sul tablet bisogna disinstallare a mano.
      - name: Chiave di firma
        env:
          CHIAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CHIAVE" ]; then
            echo "Manca il secret ANDROID_KEYSTORE_BASE64." >&2
            echo "Un APK firmato con una chiave qualsiasi non si aggiorna sopra" >&2
            echo "quello gia' sul tablet: meglio non pubblicarlo affatto." >&2
            exit 1
          fi
          echo "$CHIAVE" | base64 -d > "$RUNNER_TEMP/menu-sanpietro.p12"

      - name: Compila
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/menu-sanpietro.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          gradle assembleRelease --no-daemon \
            -PupdateBaseUrl="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Rinomina
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk menu-sanpietro.apk

      # L'impronta finisce nel riepilogo: se un giorno cambiasse, si vedrebbe
      # qui prima che sul tablet esca "App non installata".
      - name: Impronta della firma
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          impronta=$("$apksigner" verify --print-certs menu-sanpietro.apk |
            grep -i "SHA-256 digest" | head -1)
          echo "$impronta"
          {
            echo "### APK"
            echo ""
            echo "- $impronta"
            echo "- Dimensione: $(( $(wc -c < menu-sanpietro.apk) / 1024 )) KB"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: menu-sanpietro-apk
          path: menu-sanpietro.apk

      # Una release da' un link diretto: sul tablet si apre il browser,
      # si scarica e si installa, senza passare da un login GitHub.
      - name: Pubblica release
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest menu-sanpietro.apk \
            --title "APK piu' recente" \
            --notes "Installa questo file sul tablet. Aggiorna il menu da solo quando trova connessione."
        env:
          GH_TOKEN: ${{ github.token }}
